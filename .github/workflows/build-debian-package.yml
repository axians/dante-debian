---
name: Build Debian package

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive

concurrency:
  group: debian-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debian 13 (trixie)
    runs-on: ubuntu-24.04
    container:
      image: >-
        debian:13-slim@sha256:abc9cb88a5587630d7f915f47b23b0668fe250fbfc6457aa4d52b534c1bbf73f
    timeout-minutes: 45

    steps:
      - name: Install packaging tools
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends \
            adequate \
            autopkgtest \
            ca-certificates \
            devscripts \
            equivs \
            git \
            lintian \
            pristine-tar

      - name: Check out repository
        # actions/checkout v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install package build dependencies
        run: |
          mk-build-deps \
            --install \
            --remove \
            --tool 'apt-get --yes --no-install-recommends' \
            debian/control
          rm -f dante-build-deps_*.deb

      - name: Export package source
        run: |
          version="$(dpkg-parsechangelog --show-field Version)"
          upstream_version="${version%-*}"
          mkdir -p build/source
          git clone --quiet --no-single-branch \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" \
            pristine-tar-data
          git -C pristine-tar-data switch --quiet pristine-tar
          (
            cd pristine-tar-data
            pristine-tar checkout \
              "../build/dante_${upstream_version}.orig.tar.xz"
          )
          git -c safe.directory="$GITHUB_WORKSPACE" \
            archive HEAD -- . \
            ':(exclude).github' \
            ':(exclude)README.md' \
            | tar --extract --directory=build/source

      - name: Build source and binary packages
        working-directory: build/source
        run: dpkg-buildpackage --build=full --no-sign

      - name: Run Lintian
        run: lintian --allow-root --fail-on error build/dante_*.changes

      - name: Run autopkgtest
        run: |
          changes_file="$(find build -maxdepth 1 \
            -name 'dante_*_amd64.changes' -print -quit)"
          test -n "$changes_file"
          set +e
          autopkgtest "$changes_file" \
            --summary=autopkgtest-summary \
            -- null
          status=$?
          set -e

          if [ "$status" -eq 8 ] && \
             grep -Eq '^adequate[[:space:]]+PASS \(superficial\)$' \
               autopkgtest-summary; then
            status=0
          fi

          exit "$status"

      - name: Collect package artifacts
        if: always()
        run: |
          mkdir -p artifacts
          if [ -d build ]; then
            find build -maxdepth 1 -type f \
              \( -name 'dante_*.buildinfo' \
              -o -name 'dante_*.changes' \
              -o -name 'dante_*.debian.tar.*' \
              -o -name 'dante_*.dsc' \
              -o -name 'dante_*.orig.tar.*' \
              -o -name '*.deb' \
              -o -name '*.ddeb' \) \
              -exec cp --target-directory=artifacts {} +
          fi
          if [ -f autopkgtest-summary ]; then
            cp autopkgtest-summary artifacts/
          fi

      - name: Upload package artifacts
        if: always()
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dante-debian13-amd64
          path: artifacts/
          if-no-files-found: warn

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/debian/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        # actions/download-artifact v8.0.1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dante-debian13-amd64
          path: release-assets

      - name: Verify release assets
        id: release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#debian/}"
          changes_files=(release-assets/dante_*_amd64.changes)
          test "${#changes_files[@]}" -eq 1
          package_version="$(sed -n 's/^Version: //p' \
            "${changes_files[0]}")"
          test "$package_version" = "$version"

          for pattern in \
            'dante_*.buildinfo' \
            'dante_*.changes' \
            'dante_*.debian.tar.*' \
            'dante_*.dsc' \
            'dante_*.orig.tar.*' \
            '*.deb'; do
            compgen -G "release-assets/$pattern" >/dev/null
          done

          (
            cd release-assets
            sha256sum * | LC_ALL=C sort --key=2 > SHA256SUMS
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        # softprops/action-gh-release v3.0.3
        uses: >-
          softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: Dante ${{ steps.release.outputs.version }} for Debian 13
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
